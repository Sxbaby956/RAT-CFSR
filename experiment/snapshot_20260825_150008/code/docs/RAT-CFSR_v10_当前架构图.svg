<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183956"/>
      <stop offset="1" stop-color="#2f6c88"/>
    </linearGradient>
    <linearGradient id="iqGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff0fb"/>
      <stop offset="1" stop-color="#c6e0f1"/>
    </linearGradient>
    <linearGradient id="tfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1f7ee"/>
      <stop offset="1" stop-color="#c9ecd9"/>
    </linearGradient>
    <linearGradient id="expertGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#f6d88e"/>
    </linearGradient>
    <linearGradient id="cfsrGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece7fb"/>
      <stop offset="1" stop-color="#d8cff3"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6e6"/>
      <stop offset="1" stop-color="#cfe9c7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1c3448" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#395267"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b47b17"/>
    </marker>
    <style>
      .title { font: 700 38px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#152c40; }
      .subtitle { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#5b7182; }
      .section { font: 700 22px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#1b354b; }
      .boxTitle { font: 700 21px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#183149; }
      .boxText { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#314a5d; }
      .small { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#4e6374; }
      .tiny { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#607383; }
      .formula { font: italic 19px 'Times New Roman',serif; fill:#21394d; }
      .badge { font: 700 12px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#ffffff; }
      .box { stroke-width:2; filter:url(#shadow); }
      .flow { stroke:#395267; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .flowThin { stroke:#395267; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .flowGold { stroke:#b47b17; stroke-width:2.5; fill:none; marker-end:url(#arrowGold); }
      .dash { stroke-dasharray:8 7; }
    </style>
  </defs>

  <rect width="1900" height="1180" fill="url(#bg)"/>
  <rect x="28" y="28" width="1844" height="1124" rx="28" fill="none" stroke="#d6e1e8" stroke-width="2"/>

  <text x="950" y="72" text-anchor="middle" class="title">RAT-CFSR v10 当前代码架构图</text>
  <text x="950" y="104" text-anchor="middle" class="subtitle">RML2016.10a 开放集调制识别：IQ 深度语义 + 时频语义 + QAM 专家统计特征 + CFSR 类条件重构</text>

  <text x="142" y="162" text-anchor="middle" class="section">输入</text>
  <text x="510" y="162" text-anchor="middle" class="section">三路特征编码</text>
  <text x="940" y="162" text-anchor="middle" class="section">语义融合</text>
  <text x="1278" y="162" text-anchor="middle" class="section">类条件 CFSR</text>
  <text x="1660" y="162" text-anchor="middle" class="section">开放集输出</text>

  <rect x="58" y="476" width="190" height="138" rx="18" fill="url(#inputGrad)" stroke="#17314b" class="box"/>
  <path d="M86 540 C100 508,114 572,128 540 S158 508,172 540 S202 572,222 532" stroke="#c3eaff" stroke-width="4" fill="none"/>
  <text x="153" y="572" text-anchor="middle" style="font:700 24px 'Microsoft YaHei',Arial,sans-serif;fill:#ffffff">I/Q 窗口</text>
  <text x="153" y="597" text-anchor="middle" style="font:400 13px 'Microsoft YaHei',Arial,sans-serif;fill:#dcefff">2 x 128 · 归一化 · 训练增强</text>

  <circle cx="304" cy="545" r="8" fill="#395267"/>
  <path d="M248 545 H296" class="flow"/>
  <path d="M304 545 V273 H362" class="flow"/>
  <path d="M304 545 H362" class="flow"/>
  <path d="M304 545 V804 H362" class="flowGold dash"/>

  <rect x="362" y="210" width="330" height="126" rx="16" fill="url(#iqGrad)" stroke="#6595b7" class="box"/>
  <rect x="380" y="228" width="92" height="24" rx="12" fill="#34739c"/>
  <text x="426" y="245" text-anchor="middle" class="badge">IQEncoder</text>
  <text x="527" y="276" text-anchor="middle" class="boxTitle">时域残差 CNN</text>
  <text x="527" y="303" text-anchor="middle" class="boxText">Conv1D + ResidualBlock x5 + GAP</text>
  <text x="527" y="326" text-anchor="middle" class="small">输入通道：I, Q, amplitude, phase_delta</text>
  <rect x="720" y="243" width="118" height="62" rx="13" fill="#ffffff" stroke="#6595b7" stroke-width="2"/>
  <text x="779" y="270" text-anchor="middle" class="formula">z<tspan baseline-shift="sub" font-size="13">iq</tspan></text>
  <text x="779" y="292" text-anchor="middle" class="small">semantic_dim</text>
  <path d="M692 273 H720" class="flowThin"/>

  <rect x="362" y="462" width="154" height="166" rx="16" fill="url(#tfGrad)" stroke="#5ca77d" class="box"/>
  <rect x="380" y="480" width="64" height="24" rx="12" fill="#3a8d63"/>
  <text x="412" y="497" text-anchor="middle" class="badge">STFT</text>
  <text x="439" y="535" text-anchor="middle" class="boxTitle">复数谱图</text>
  <text x="439" y="564" text-anchor="middle" class="boxText">n_fft=64</text>
  <text x="439" y="588" text-anchor="middle" class="boxText">hop=32</text>
  <text x="439" y="612" text-anchor="middle" class="small">log1p |STFT| 标准化</text>
  <path d="M516 545 H548" class="flowThin"/>

  <rect x="548" y="450" width="298" height="190" rx="16" fill="url(#tfGrad)" stroke="#5ca77d" class="box"/>
  <rect x="566" y="468" width="118" height="24" rx="12" fill="#3a8d63"/>
  <text x="625" y="485" text-anchor="middle" class="badge">SpectrogramEncoder</text>
  <text x="697" y="518" text-anchor="middle" class="boxTitle">多尺度膨胀 CNN</text>
  <rect x="578" y="542" width="76" height="46" rx="9" fill="#ffffff" stroke="#5ca77d"/>
  <rect x="659" y="542" width="76" height="46" rx="9" fill="#ffffff" stroke="#5ca77d"/>
  <rect x="740" y="542" width="76" height="46" rx="9" fill="#ffffff" stroke="#5ca77d"/>
  <text x="616" y="570" text-anchor="middle" class="small">d=1</text>
  <text x="697" y="570" text-anchor="middle" class="small">d=3</text>
  <text x="778" y="570" text-anchor="middle" class="small">d=5</text>
  <text x="697" y="618" text-anchor="middle" class="small">concat + Linear + LayerNorm</text>
  <rect x="874" y="514" width="118" height="62" rx="13" fill="#ffffff" stroke="#5ca77d" stroke-width="2"/>
  <text x="933" y="541" text-anchor="middle" class="formula">z<tspan baseline-shift="sub" font-size="13">tf</tspan></text>
  <text x="933" y="563" text-anchor="middle" class="small">semantic_dim</text>
  <path d="M846 545 H874" class="flowThin"/>

  <rect x="362" y="720" width="330" height="168" rx="16" fill="url(#expertGrad)" stroke="#b47b17" class="box"/>
  <rect x="380" y="738" width="138" height="24" rx="12" fill="#b47b17"/>
  <text x="449" y="755" text-anchor="middle" class="badge">ExpertFeatureEncoder</text>
  <text x="527" y="789" text-anchor="middle" class="boxTitle">QAM 专家统计特征</text>
  <text x="527" y="818" text-anchor="middle" class="boxText">16 维：幅度形状 · 相位差 · 高阶矩</text>
  <text x="527" y="844" text-anchor="middle" class="small">E[ x^2 ], E[ x^4 ], E[ x^6 ] · 半径分位数</text>
  <text x="527" y="868" text-anchor="middle" class="tiny">面向 QAM16/QAM64 星座半径层级与高阶分布差异</text>
  <rect x="720" y="773" width="118" height="62" rx="13" fill="#ffffff" stroke="#b47b17" stroke-width="2"/>
  <text x="779" y="800" text-anchor="middle" class="formula">z<tspan baseline-shift="sub" font-size="13">exp</tspan></text>
  <text x="779" y="822" text-anchor="middle" class="small">semantic_dim</text>
  <path d="M692 804 H720" class="flowGold"/>

  <rect x="1030" y="426" width="244" height="160" rx="18" fill="#fff7df" stroke="#c5912e" class="box"/>
  <rect x="1048" y="444" width="92" height="24" rx="12" fill="#b47b17"/>
  <text x="1094" y="461" text-anchor="middle" class="badge">GatedFusion</text>
  <text x="1152" y="497" text-anchor="middle" class="boxTitle">IQ / TF 门控融合</text>
  <text x="1152" y="529" text-anchor="middle" class="formula">z<tspan baseline-shift="sub" font-size="13">base</tspan> = LN(g<tspan baseline-shift="sub" font-size="13">iq</tspan>z<tspan baseline-shift="sub" font-size="13">iq</tspan> + g<tspan baseline-shift="sub" font-size="13">tf</tspan>z<tspan baseline-shift="sub" font-size="13">tf</tspan>)</text>
  <text x="1152" y="559" text-anchor="middle" class="small">训练时 modality dropout</text>
  <path d="M838 273 C942 273 952 448 1030 475" class="flow"/>
  <path d="M992 545 H1030" class="flow"/>

  <rect x="1030" y="690" width="244" height="130" rx="18" fill="url(#expertGrad)" stroke="#b47b17" class="box"/>
  <text x="1152" y="734" text-anchor="middle" class="boxTitle">专家残差注入</text>
  <text x="1152" y="768" text-anchor="middle" class="formula">z = LN(z<tspan baseline-shift="sub" font-size="13">base</tspan> + 0.25 z<tspan baseline-shift="sub" font-size="13">exp</tspan>)</text>
  <text x="1152" y="798" text-anchor="middle" class="small">当前版本默认开启，不新增参数</text>
  <path d="M838 804 H1030" class="flowGold"/>
  <path d="M1152 586 V690" class="flowGold"/>

  <rect x="1326" y="212" width="214" height="102" rx="16" fill="#f1f6fb" stroke="#839db3" class="box"/>
  <text x="1433" y="252" text-anchor="middle" class="boxTitle">Closed-set 分类头</text>
  <text x="1433" y="282" text-anchor="middle" class="boxText">Linear(z) -> K known logits</text>
  <path d="M1274 506 C1318 506 1300 263 1326 263" class="flow"/>

  <rect x="1320" y="434" width="252" height="194" rx="18" fill="url(#cfsrGrad)" stroke="#8e7bc6" class="box"/>
  <rect x="1338" y="452" width="90" height="24" rx="12" fill="#7b65b4"/>
  <text x="1383" y="469" text-anchor="middle" class="badge">CFSR</text>
  <text x="1446" y="501" text-anchor="middle" class="boxTitle">类条件投影与重构</text>
  <text x="1446" y="533" text-anchor="middle" class="formula">p<tspan baseline-shift="sub" font-size="13">k</tspan>(z) -> AE<tspan baseline-shift="sub" font-size="13">k</tspan> -> r<tspan baseline-shift="sub" font-size="13">k</tspan></text>
  <text x="1446" y="562" text-anchor="middle" class="boxText">每个已知类一套 projector + AE</text>
  <text x="1446" y="590" text-anchor="middle" class="small">loss: CE + recon + margin + open head</text>
  <path d="M1274 755 C1317 755 1288 531 1320 531" class="flow"/>

  <rect x="1326" y="748" width="214" height="102" rx="16" fill="#efeafa" stroke="#8e7bc6" class="box"/>
  <text x="1433" y="786" text-anchor="middle" class="boxTitle">Open binary heads</text>
  <text x="1433" y="816" text-anchor="middle" class="boxText">embedding_k -> known/other</text>
  <path d="M1446 628 V748" class="flowThin"/>

  <rect x="1634" y="268" width="218" height="126" rx="18" fill="url(#decisionGrad)" stroke="#6aa15d" class="box"/>
  <text x="1743" y="312" text-anchor="middle" class="boxTitle">候选类预测</text>
  <text x="1743" y="344" text-anchor="middle" class="formula">argmax logits</text>
  <text x="1743" y="371" text-anchor="middle" class="small">known class id</text>
  <path d="M1540 263 C1584 263 1588 331 1634 331" class="flow"/>

  <rect x="1634" y="486" width="218" height="150" rx="18" fill="url(#decisionGrad)" stroke="#6aa15d" class="box"/>
  <text x="1743" y="529" text-anchor="middle" class="boxTitle">开放集拒识分数</text>
  <text x="1743" y="562" text-anchor="middle" class="formula">score = || z - proto<tspan baseline-shift="sub" font-size="13">candidate</tspan> ||</text>
  <text x="1743" y="592" text-anchor="middle" class="small">默认 open_set_score = prototype</text>
  <text x="1743" y="616" text-anchor="middle" class="small">class-conditional threshold q=0.90</text>
  <path d="M1572 531 H1634" class="flow"/>
  <path d="M1540 263 C1582 263 1585 561 1634 561" class="flowThin dash"/>

  <rect x="1634" y="748" width="218" height="138" rx="18" fill="#fff6df" stroke="#b47b17" class="box"/>
  <text x="1743" y="790" text-anchor="middle" class="boxTitle">校准集过滤</text>
  <text x="1743" y="823" text-anchor="middle" class="boxText">只用分类正确样本拟合阈值</text>
  <text x="1743" y="850" text-anchor="middle" class="small">避免 QAM 错分污染 prototype calibration</text>
  <path d="M1540 799 H1634" class="flowGold dash"/>

  <rect x="1634" y="966" width="218" height="102" rx="18" fill="#e6f2fb" stroke="#6595b7" class="box"/>
  <text x="1743" y="1005" text-anchor="middle" class="boxTitle">最终标签</text>
  <text x="1743" y="1035" text-anchor="middle" class="boxText">known modulation 或 unknown</text>
  <path d="M1743 636 V966" class="flow"/>

  <rect x="72" y="962" width="1330" height="106" rx="18" fill="#ffffff" stroke="#d3dee6" stroke-width="2"/>
  <text x="102" y="1002" class="boxTitle">当前训练策略</text>
  <text x="102" y="1033" class="boxText">Stage 1: 纯 closed-set CE warmup，避免 contrastive 抬高 warmup loss。</text>
  <text x="632" y="1033" class="boxText">Stage 2: CFSR reconstruction/margin/open loss + 小权重 supervised contrastive。</text>
  <text x="102" y="1058" class="small">日志关注：QAM16/QAM64 accepted_accuracy、confused_as_QAM64 / confused_as_QAM16、known false reject rate。</text>

  <text x="950" y="1128" text-anchor="middle" class="tiny">Generated from current RAT-CFSR code structure: rat_cfsr/model.py, rat_cfsr/losses.py, rat_cfsr/train.py</text>
</svg>
