[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rat-cfsr"
version = "0.1.0"
description = "Dual-view class-feature-space reconstruction for open-set wireless technology recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rat-cfsr-train = "rat_cfsr.train:main"
rat-cfsr-inspect = "rat_cfsr.inspect_data:main"

[tool.hatch.build.targets.wheel]
packages = ["rat_cfsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

