<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .band { fill: #ffffff; stroke: #ccd3df; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #49627a; stroke-width: 2; rx: 8; }
      .code { fill: #eef6ff; stroke: #2d6fa3; stroke-width: 2; rx: 8; }
      .paper { fill: #fff7e8; stroke: #b5761d; stroke-width: 2; rx: 8; }
      .warn { fill: #fff0f0; stroke: #b54a4a; stroke-width: 2; rx: 8; }
      .ok { fill: #eef9ef; stroke: #3c7f47; stroke-width: 2; rx: 8; }
      .muted { fill: #f2f4f7; stroke: #8b96a5; stroke-width: 2; rx: 8; }
      .title { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 18px; fill: #53606f; }
      .section { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #1f2933; }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 17px; fill: #24313f; }
      .small { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #455466; }
      .tiny { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; fill: #627084; }
      .label { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #233142; }
      .arrow { stroke: #34495e; stroke-width: 2.4; fill: none; marker-end: url(#arrowHead); }
      .dash { stroke: #7f8c99; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowHeadGrey); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#34495e"/>
    </marker>
    <marker id="arrowHeadGrey" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#7f8c99"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1260"/>
  <text class="title" x="70" y="62">RAT-CFSR 当前代码流程框图与 CFSR 论文差异</text>
  <text class="subtitle" x="70" y="94">基于 main.py、rat_cfsr/data.py、model.py、losses.py、calibration.py、train.py、metrics.py 静态审计绘制</text>

  <rect class="band" x="50" y="130" width="1220" height="1030" rx="10"/>
  <rect class="band" x="1310" y="130" width="430" height="1030" rx="10"/>
  <text class="section" x="80" y="170">当前项目代码真实执行链路</text>
  <text class="section" x="1340" y="170">相对 CFSR 论文的主要差异</text>

  <!-- Data pipeline -->
  <text class="label" x="80" y="220">1. 数据与开放集划分</text>
  <rect class="code" x="80" y="240" width="250" height="108"/>
  <text class="text" x="205" y="273" text-anchor="middle">RML2016.10a pkl</text>
  <text class="small" x="205" y="302" text-anchor="middle">10 类池：去除 AM-SSB</text>
  <text class="tiny" x="205" y="326" text-anchor="middle">每样本 [2,128]，SNR -20..18</text>

  <rect class="code" x="380" y="240" width="270" height="108"/>
  <text class="text" x="515" y="273" text-anchor="middle">按 unknown 构造 label_map</text>
  <text class="small" x="515" y="302" text-anchor="middle">known: 0..K-1</text>
  <text class="tiny" x="515" y="326" text-anchor="middle">unknown: label = -1</text>

  <rect class="code" x="700" y="240" width="270" height="108"/>
  <text class="text" x="835" y="273" text-anchor="middle">按 调制×SNR 分层随机切分</text>
  <text class="small" x="835" y="302" text-anchor="middle">known: train/cal/test = 60/20/20</text>
  <text class="tiny" x="835" y="326" text-anchor="middle">unknown: 仅 test fraction 进入测试</text>

  <rect class="code" x="1020" y="240" width="200" height="108"/>
  <text class="text" x="1120" y="273" text-anchor="middle">Dataset 归一化</text>
  <text class="small" x="1120" y="302" text-anchor="middle">复 IQ 去均值</text>
  <text class="tiny" x="1120" y="326" text-anchor="middle">RMS 功率归一</text>

  <path class="arrow" d="M330 294 H370"/>
  <path class="arrow" d="M650 294 H690"/>
  <path class="arrow" d="M970 294 H1010"/>

  <!-- Model forward -->
  <text class="label" x="80" y="400">2. 模型前向 RATCFSR.forward</text>
  <rect class="box" x="80" y="420" width="230" height="92"/>
  <text class="text" x="195" y="454" text-anchor="middle">I/Q 输入 [B,2,T]</text>
  <text class="small" x="195" y="482" text-anchor="middle">无 STFT 分支</text>

  <rect class="box" x="360" y="420" width="250" height="92"/>
  <text class="text" x="485" y="454" text-anchor="middle">1D ResNet18 Encoder</text>
  <text class="small" x="485" y="482" text-anchor="middle">stem stride=1，无 maxpool</text>

  <rect class="box" x="660" y="420" width="220" height="92"/>
  <text class="text" x="770" y="454" text-anchor="middle">semantic z</text>
  <text class="small" x="770" y="482" text-anchor="middle">Linear + LN + GELU，再 L2 normalize</text>

  <rect class="box" x="930" y="420" width="250" height="92"/>
  <text class="text" x="1055" y="454" text-anchor="middle">K 个 ClassProjector</text>
  <text class="small" x="1055" y="482" text-anchor="middle">MLP: D→D→d，末端 tanh</text>

  <path class="arrow" d="M310 466 H350"/>
  <path class="arrow" d="M610 466 H650"/>
  <path class="arrow" d="M880 466 H920"/>

  <rect class="box" x="80" y="550" width="260" height="105"/>
  <text class="text" x="210" y="584" text-anchor="middle">K 个 Bottleneck AE</text>
  <text class="small" x="210" y="612" text-anchor="middle">每个 AE 重构所有投影空间</text>
  <text class="tiny" x="210" y="635" text-anchor="middle">得到 K×K 重构误差矩阵</text>

  <rect class="box" x="390" y="550" width="260" height="105"/>
  <text class="text" x="520" y="584" text-anchor="middle">对角线误差 e_k</text>
  <text class="small" x="520" y="612" text-anchor="middle">logits = -e_k</text>
  <text class="tiny" x="520" y="635" text-anchor="middle">候选类 argmin(e_k)</text>

  <rect class="box" x="700" y="550" width="260" height="105"/>
  <text class="text" x="830" y="584" text-anchor="middle">K 个 OpenSetBinaryHead</text>
  <text class="small" x="830" y="612" text-anchor="middle">只接收匹配支路 AE encoder embedding</text>
  <text class="tiny" x="830" y="635" text-anchor="middle">输出 open_logits [B,K]</text>

  <path class="arrow" d="M1055 512 C1055 535, 210 525, 210 540"/>
  <path class="arrow" d="M340 603 H380"/>
  <path class="dash" d="M210 655 C210 690, 830 690, 830 665"/>

  <!-- Training -->
  <text class="label" x="80" y="720">3. 训练流程</text>
  <rect class="muted" x="80" y="740" width="220" height="105"/>
  <text class="text" x="190" y="774" text-anchor="middle">Stage 1 可选</text>
  <text class="small" x="190" y="802" text-anchor="middle">默认 main.py 为 0 epoch</text>
  <text class="tiny" x="190" y="825" text-anchor="middle">classification_only=True</text>

  <rect class="ok" x="350" y="740" width="270" height="105"/>
  <text class="text" x="485" y="774" text-anchor="middle">Stage 2 CFSR 训练</text>
  <text class="small" x="485" y="802" text-anchor="middle">AdamW + CosineAnnealingLR</text>
  <text class="tiny" x="485" y="825" text-anchor="middle">early stop 监控 val_acc 或 val_loss</text>

  <rect class="ok" x="670" y="740" width="270" height="105"/>
  <text class="text" x="805" y="774" text-anchor="middle">L_r 重构分类损失</text>
  <text class="small" x="805" y="802" text-anchor="middle">对每个 AE 列做 CE</text>
  <text class="tiny" x="805" y="825" text-anchor="middle">softmax(-errors / temperature)</text>

  <rect class="ok" x="990" y="740" width="230" height="105"/>
  <text class="text" x="1105" y="774" text-anchor="middle">L_o 伪未知 BCE</text>
  <text class="small" x="1105" y="802" text-anchor="middle">one-vs-rest 目标</text>
  <text class="tiny" x="1105" y="825" text-anchor="middle">total = L_r + open_weight L_o</text>

  <path class="arrow" d="M300 793 H340"/>
  <path class="arrow" d="M620 793 H660"/>
  <path class="arrow" d="M940 793 H980"/>

  <!-- Calibration inference eval -->
  <text class="label" x="80" y="910">4. 标定、推理与评估</text>
  <rect class="code" x="80" y="930" width="250" height="105"/>
  <text class="text" x="205" y="964" text-anchor="middle">收集 calibration 输出</text>
  <text class="small" x="205" y="992" text-anchor="middle">errors / logits / open_logits / features</text>
  <text class="tiny" x="205" y="1015" text-anchor="middle">默认不使用 unknown 标定</text>

  <rect class="code" x="380" y="930" width="270" height="105"/>
  <text class="text" x="515" y="964" text-anchor="middle">开放集分数与阈值</text>
  <text class="small" x="515" y="992" text-anchor="middle">默认 reconstruction + 每类每 SNR 阈值</text>
  <text class="tiny" x="515" y="1015" text-anchor="middle">可选 energy / prototype / open_head 等</text>

  <rect class="code" x="700" y="930" width="230" height="105"/>
  <text class="text" x="815" y="964" text-anchor="middle">测试样本推理</text>
  <text class="small" x="815" y="992" text-anchor="middle">candidate = argmin/argmax</text>
  <text class="tiny" x="815" y="1015" text-anchor="middle">score ≤ 阈值: known，否则 unknown(-1)</text>

  <rect class="code" x="980" y="930" width="240" height="105"/>
  <text class="text" x="1100" y="964" text-anchor="middle">输出实验产物</text>
  <text class="small" x="1100" y="992" text-anchor="middle">metrics / confusion / predictions</text>
  <text class="tiny" x="1100" y="1015" text-anchor="middle">AUROC, AUPR, OSCR, F1, SNR 分组</text>

  <path class="arrow" d="M330 983 H370"/>
  <path class="arrow" d="M650 983 H690"/>
  <path class="arrow" d="M930 983 H970"/>
  <path class="dash" d="M1100 930 C1130 880, 1130 840, 1120 845"/>

  <!-- Difference panel -->
  <rect class="warn" x="1340" y="210" width="360" height="112"/>
  <text class="text" x="1360" y="242">数据集不同</text>
  <text class="small" x="1360" y="272">论文主实验 HKDD12，另含 RML2016.10b/HKDD36；</text>
  <text class="small" x="1360" y="296">当前代码跑 RML2016.10a，且类池去掉 AM-SSB。</text>

  <rect class="warn" x="1340" y="345" width="360" height="126"/>
  <text class="text" x="1360" y="377">开放集划分与折数不同</text>
  <text class="small" x="1360" y="407">论文通常 7 known / 5 unknown、5 折交叉验证；</text>
  <text class="small" x="1360" y="431">当前默认 folds=1，main.py 默认 unknown 来自 train.py</text>
  <text class="small" x="1360" y="455">并可通过 matrix 做逐一 held-out。</text>

  <rect class="warn" x="1340" y="495" width="360" height="118"/>
  <text class="text" x="1360" y="527">模型细节不完全等同</text>
  <text class="small" x="1360" y="557">论文只称 modified 1D ResNet18，未给细节；</text>
  <text class="small" x="1360" y="581">代码明确 stem stride=1、无 maxpool、语义层 LN/GELU。</text>

  <rect class="warn" x="1340" y="637" width="360" height="118"/>
  <text class="text" x="1360" y="669">额外工程改造</text>
  <text class="small" x="1360" y="699">代码增加 L2 normalize、projector tanh、AE 输入噪声选项、</text>
  <text class="small" x="1360" y="723">温度缩放、梯度裁剪、早停和两阶段训练。</text>

  <rect class="warn" x="1340" y="779" width="360" height="118"/>
  <text class="text" x="1360" y="811">阈值标定不同</text>
  <text class="small" x="1360" y="841">论文按每类训练误差分布取阈值，η 未明确；</text>
  <text class="small" x="1360" y="865">代码默认独立 calibration split，且 reconstruction 模式按</text>
  <text class="small" x="1360" y="889">每类×SNR 分位数阈值。</text>

  <rect class="warn" x="1340" y="921" width="360" height="118"/>
  <text class="text" x="1360" y="953">推理分数扩展</text>
  <text class="small" x="1360" y="983">论文推理主要用对角线重构误差；</text>
  <text class="small" x="1360" y="1007">代码还支持 energy、max_softmax、max_logit、</text>
  <text class="small" x="1360" y="1031">prototype、open_head 等替代分数。</text>

  <rect class="paper" x="1340" y="1063" width="360" height="72"/>
  <text class="text" x="1360" y="1095">文档/README 与代码不一致</text>
  <text class="small" x="1360" y="1123">README 和部分方案文档提到 STFT/门控/margin，当前核心代码未实现。</text>

  <text class="tiny" x="80" y="1210">生成说明：此图描述当前仓库代码路径，不代表 CFSR 论文原始官方实现。</text>
</svg>
